name: Build Windows EXE

# 触发条件：当代码推送到 main 或 master 分支，或者在 Actions 页面手动点击运行
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    name: Package Python Script
    runs-on: windows-latest  # 使用 Windows 环境打包成 exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # 已彻底移除 cache: 'pip' 配置，规避找不到 requirements.txt 的报错

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 一键安装所需的 Pandas、Excel 引擎以及打包工具
          pip install pandas openpyxl pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          # --onefile 表示打包成单个独立的 exe 文件
          pyinstaller --onefile "运费test1.py"

      - name: Upload Output EXE
        uses: actions/upload-artifact@v4
        with:
          name: 运费test1-exe
          path: dist/运费test1.exe
          retention-days: 7  # 在 GitHub Actions 页面保留 7 天供下载
