name: Build Windows EXE

# 触发条件：当代码推送到 main 分支，或者在 Actions 页面手动点击运行
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    name: Package Python Script
    runs-on: windows-latest  # 指定使用 Windows 运行环境打包

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 3.10 版本对 Pandas 和 PyInstaller 兼容性极佳
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 必须安装 openpyxl，否则 pandas 无法读取 .xlsx 文件
          pip install pandas openpyxl pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          # --onefile 表示打包成单文件，不带黑框的话可以加 --noconsole，但你有 print 和 input，所以需要保留控制台
          pyinstaller --onefile "运费test1.py"

      - name: Upload Output EXE
        uses: actions/upload-artifact@v4
        with:
          name: 运费test1-exe
          path: dist/运费test1.exe
          retention-days: 7 # 生成的 exe 文件在 GitHub 上保留 7 天
